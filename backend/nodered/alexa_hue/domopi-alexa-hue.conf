# DomoPi (25/10/2026): recent Echo devices reach an emulated Hue bridge only on port 80, whatever port
# it announces. Pass the Hue paths to the Node-RED amazon-echo-hub (port 8980); nothing else changes.
# Replaces the old iptables redirect 80 -> 8980, lost when the firewall rules were rewritten on 10/10.
# Rollback: a2disconf domopi-alexa-hue && systemctl reload apache2
ProxyPass        /api             http://127.0.0.1:8980/api
ProxyPassReverse /api             http://127.0.0.1:8980/api
ProxyPass        /description.xml http://127.0.0.1:8980/description.xml
