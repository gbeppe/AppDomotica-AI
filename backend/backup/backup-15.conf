# rasp_backup.sh configuration for the .15 (emonpi). Installed as /etc/domopi-backup/backup.conf.
HOST_DIR=192-168-1-15
NFS_EXPORT=192.168.1.4:/rasp-backup
MOUNT=/mnt/rasp-backup
MYSQL_DBS="emoncms"
KEEP_DAILY=14
KEEP_WEEKLY=8
KEEP_MONTHLY=2
# Nightly snapshot: only what changes and matters (user decision 24/10/2026); the weekly image has
# everything else. The emoncms data (/var/opt/emoncms) already has its own nightly backup
# (emoncms-drive-backup.timer to 192.168.1.4:/emoncms-backup), so neither the snapshot nor the image copies it.
SNAPSHOT_SOURCES="/etc /boot/config.txt /boot/cmdline.txt /root /usr/local /opt/domopi-health
 /opt/domopi-backup /var/lib/mosquitto /var/spool/cron/crontabs /var/backups/domopi
 /var/www/emoncms/settings.ini /home/pi/.node-red /home/pi/data /home/pi/.config /home/pi/*.sh
 /home/pi/*.py"
# emoncms data (partition 3) has its own nightly backup with weekly verify (emoncms-drive-backup to
# 192.168.1.4:/emoncms-backup): the image keeps only its folders; restore = image + that backup (user
# decision 25/10/2026, docs/AI_MODE/BACKUP_RASPBERRY.md §4).
IMAGE_SKIP_DATA=/var/opt/emoncms
# Node-RED modules only in the snapshot: the image must keep them to start Node-RED after a restore.
SNAPSHOT_EXCLUDES=('/home/pi/.node-red/node_modules/*')   # quoted: patterns, not globs
