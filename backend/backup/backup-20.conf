# rasp_backup.sh configuration for the .20 (domopi). Installed as /etc/domopi-backup/backup.conf.
HOST_DIR=192-168-1-20
NFS_EXPORT=192.168.1.4:/rasp-backup
MOUNT=/mnt/rasp-backup
MYSQL_DBS="domotica"
KEEP_DAILY=14
KEEP_WEEKLY=8
KEEP_MONTHLY=2
# Nightly snapshot: only what changes and matters (user decision 24/10/2026); the weekly image has
# everything else. Globs are expanded when the backup runs; missing paths are logged and skipped.
SNAPSHOT_SOURCES="/etc /boot/config.txt /boot/cmdline.txt /root /usr/local /opt/domopi-house-ai
 /opt/domopi-health /opt/domopi-backup /var/lib/mosquitto /var/lib/ntfy /var/cache/ntfy
 /var/lib/tailscale /var/spool/cron/crontabs /var/backups/domopi
 /home/pi/.node-red /home/pi/AI_climate /home/pi/.config /home/pi/*.sh /home/pi/*.php /home/pi/*.py"
# Pi-hole query history: 752 MB rewritten every day, not needed for a restore (configuration kept);
# Node-RED modules only in the snapshot: the image must keep them to start Node-RED after a restore.
SNAPSHOT_EXCLUDES=('/etc/pihole/pihole-FTL.db' '/home/pi/.node-red/node_modules/*')   # quoted: patterns, not globs
IMAGE_EXCLUDES=('/etc/pihole/pihole-FTL.db')
# The image is built on the SD (45 GB free) and copied to the QNAP as one file: writing it through NFS
# with a loop device was too slow on this host (25-26/10/2026). After the SSD (B5) it is built there.
IMAGE_STAGING=/var/lib/domopi-backup/staging
